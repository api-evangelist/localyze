aid: localyze
name: Localyze
description: >-
  Localyze is a global mobility and immigration platform that helps companies
  relocate and manage employees across borders. It centralizes visa and
  immigration case management, relocation and destination services, workations,
  and business-travel compliance in one system, with prebuilt two-way HRIS
  integrations (BambooHR, Personio, Workday, HiBob, SAP SuccessFactors, Okta,
  Google Workspace) that sync team data into Localyze cases and return
  immigration documents back to the HR system. Localyze is a Hamburg,
  Germany-based SaaS company backed by General Catalyst. As of this profile it
  publishes prebuilt HRIS connectors rather than a public developer API.
